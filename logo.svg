<svg width="40" height="40" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle">
  <!-- Outer hexagon layers (dark) -->
  <g fill="none" stroke="#1dd1a1" stroke-width="3">
    <!-- Outer layer -->
    <path d="M50 10 L85 32.5 L85 77.5 L50 100 L15 77.5 L15 32.5 Z"/>
    <!-- Middle layer -->
    <path d="M50 25 L75 40 L75 70 L50 85 L25 70 L25 40 Z" opacity="0.7"/>
    <!-- Inner layer -->
    <path d="M50 40 L65 48 L65 62 L50 70 L35 62 L35 48 Z" opacity="0.5"/>
  </g>
  
  <!-- Center hexagon (filled with green) -->
  <polygon points="50,40 65,48 65,62 50,70 35,62 35,48" fill="#1dd1a1" opacity="0.8"/>
  
  <!-- Keyhole -->
  <g fill="#0f1419">
    <!-- Keyhole circle -->
    <circle cx="50" cy="52" r="5"/>
    <!-- Keyhole shaft -->
    <rect x="47" y="57" width="6" height="8" rx="1"/>
  </g>
</svg>
